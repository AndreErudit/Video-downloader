<!DOCTYPE html>
<html>
<head>

<title>Video Downloader Pro</title>
<link rel="stylesheet" href="/static/style.css">
<script async src="https://adsbygoogle.js"></script>

</head>

<body>

<div class="container">

<h1>Video Downloader</h1>

<form method="POST">

<input type="text" name="url" placeholder="Collez le lien de la vidéo">

<select name="quality">

<option value="720">720p</option>
<option value="1080">1080p</option>
<option value="mp3">MP3</option>

</select>

<button type="submit">Télécharger</button>

</form>

{% if title %}

<div class="video">

<h2>{{title}}</h2>

<img src="{{thumbnail}}">

</div>

{% endif %}

</div>

</body>
</html>
